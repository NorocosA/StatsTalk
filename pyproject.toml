[tool.ruff]
# Ruff — all-in-one linter + formatter for Python
# Run: ruff check --fix  (auto-fix lint)
# Run: ruff format       (format code)

target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade (modern Python)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E402",  # module-level import not at top (allowed for sys.path setup)
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]   # scripts may need path manipulation

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["snla/tests"]
markers = [
    "slow: tests that require a real LLM or SPSS process",
]

[tool.coverage.run]
source = ["snla"]
omit = [
    "snla/tests/*",
    "snla/executor/adapter.py",
    "snla/executor/spss.py",
    "snla/explainer/charts.py",
    "snla/rag/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
